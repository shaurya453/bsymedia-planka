# Recipient is the "PLANKA Secrets" GPG key (fingerprint below). Its private
# key lives only in whoever's local keyring imports it + a passphrase-backed
# export kept off this VM (see README.md "Secrets management"). Encrypting
# only ever needs the public half, so `scripts/encrypt-secrets.sh` runs
# without the passphrase; decrypting needs the private key unlocked.
creation_rules:
  - path_regex: secrets/.*\.env$
    input_type: dotenv
    output_type: dotenv
    pgp: BF1F9D2C001719E61DC2AD66C74FDCF778435A45
  - path_regex: secrets/.*\.json$
    input_type: binary
    output_type: json
    pgp: BF1F9D2C001719E61DC2AD66C74FDCF778435A45
