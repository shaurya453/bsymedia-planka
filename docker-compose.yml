services:
  planka:
    image: ghcr.io/plankanban/planka:2.1.1
    restart: unless-stopped
    volumes:
      - data:/app/data
    ports:
      - 127.0.0.1:3001:1337
    environment:
      - BASE_URL=${BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - TRUST_PROXY=true
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G

  invite-service:
    build: ./invite-service
    restart: unless-stopped
    ports:
      - 127.0.0.1:3002:3000
    environment:
      - PUBLIC_URL=${PUBLIC_URL}
      - PLANKA_PUBLIC_URL=${PLANKA_PUBLIC_URL}
      - PLANKA_INTERNAL_URL=${PLANKA_INTERNAL_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - OPS_DATABASE_URL=${OPS_DATABASE_URL}
      - PLANKA_SERVICE_EMAIL=${PLANKA_SERVICE_EMAIL}
      - PLANKA_SERVICE_PASSWORD=${PLANKA_SERVICE_PASSWORD}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      planka:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

volumes:
  data:
  db-data:
